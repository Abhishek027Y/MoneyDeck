<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Institution Details — MoneyDeck</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:"class",theme:{extend:{fontFamily:{"headline-sm":["Inter"],"label-sm":["Inter"],"body-md":["Inter"],"body-sm":["Inter"],"tabular-num":["Inter"]}}}};</script>
<style>html,body{margin:0;padding:0;}::-webkit-scrollbar{display:none;}</style>
<link rel="stylesheet" href="/app/assets/stitch-harmonization.css"/></head>
<body class="bg-[#F5F7FA] font-body-md text-[#202B38] antialiased">
<script src="/app/assets/app.js"></script>
<script src="/app/assets/shell.js"></script>
<script>
'use strict';

async function boot() {
  await MDShell.init({
    role: 'college', page: 'Institution Details', icon: 'account_balance',
    heading: 'Institution Profile',
    subheading: 'Official registration details and the authorized officers that AICTE correspondence can be addressed to. Changes to this profile require a verified AICTE process.',
  });
  const { data } = await MD.api('GET', '/college/institution');
  const i = data.institution;

  const rows = Object.entries(i)
    .filter(([k]) => k !== 'authorized_contacts' && !['id', 'created_at', 'updated_at'].includes(k))
    .map(([k, v]) => `<tr class="border-b border-slate-100">
      <td class="py-2 pr-4 text-[11px] font-semibold text-slate-500 uppercase tracking-wide whitespace-nowrap">${k.replace(/_/g, ' ')}</td>
      <td class="py-2 text-[13px]">${v == null || v === '' ? '—' : MD.escapeHtml(String(v))}</td></tr>`).join('');

  const contacts = (i.authorized_contacts || []).map((c) => `
    <div class="p-3 border border-[#E2E7ED] rounded-lg bg-slate-50 flex items-center justify-between gap-3">
      <div>
        <p class="text-[13px] font-semibold text-slate-700">${MD.escapeHtml(c.name || c.display_name || '')}</p>
        <p class="text-[11px] text-slate-500">${MD.escapeHtml(c.designation || c.role || '')}</p>
        <p class="text-[11px] text-slate-400 font-tabular-num">${MD.escapeHtml(c.email || '')}${c.phone ? ' • ' + MD.escapeHtml(c.phone) : ''}</p>
      </div>
      ${c.verified ? '<span class="px-2 py-0.5 text-[10px] font-semibold rounded bg-[#EAF6ED] text-[#1E7E34] border border-[#1E7E3455] uppercase">Verified</span>'
                   : '<span class="px-2 py-0.5 text-[10px] font-semibold rounded bg-slate-100 text-slate-500 border border-slate-200 uppercase">Unverified</span>'}
    </div>`).join('');

  document.getElementById('mdshell-content').insertAdjacentHTML('beforeend', `
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 items-start">
      <div class="bg-white rounded-lg border border-[#E2E7ED] shadow-sm p-5">
        <h2 class="font-headline-sm text-[16px] font-semibold text-[#142D4E]">Registration data</h2>
        <table class="w-full mt-3">${rows}</table>
      </div>
      <div class="bg-white rounded-lg border border-[#E2E7ED] shadow-sm p-5">
        <h2 class="font-headline-sm text-[16px] font-semibold text-[#142D4E]">Authorized contacts</h2>
        <p class="text-[11px] text-slate-500 mt-1">Only these officers may submit FDR data and receive verification correspondence on behalf of the institution.</p>
        <div class="flex flex-col gap-2 mt-3">${contacts || '<p class="text-[12px] text-slate-500">No contacts registered.</p>'}</div>
      </div>
    </div>`);
}
boot().catch((e) => MD.toast(e.message, true));
</script>
</body>
</html>
