<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Release Requests — MoneyDeck</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:"class",theme:{extend:{fontFamily:{"headline-sm":["Inter"],"label-sm":["Inter"],"body-md":["Inter"],"body-sm":["Inter"],"tabular-num":["Inter"]}}}};</script>
<style>html,body{margin:0;padding:0;}::-webkit-scrollbar{display:none;}</style>
<link rel="stylesheet" href="/app/assets/stitch-harmonization.css"/></head>
<body class="bg-[#F5F7FA] font-body-md text-[#202B38] antialiased">
<script src="/app/assets/app.js"></script>
<script src="/app/assets/shell.js"></script>
<script>
'use strict';

async function boot() {
  await MDShell.init({
    role: 'college', page: 'Release Requests', icon: 'outbox',
    heading: 'Lien Release Requests',
    subheading: 'Request AICTE officer approval to release a pledged FDR. Requests with a pending or approved state cannot be duplicated, and released FDRs are recorded permanently.',
  });
  const [{ data: releases }, { data: fdrs }] = await Promise.all([
    MD.api('GET', '/college/releases'),
    MD.api('GET', '/college/fdrs?perPage=100'),
  ]);
  render(releases.releases, fdrs.fdrs);
}

function releaseBadge(s) {
  const map = {
    pending: ['bg-[#FEF7EC]', 'border-[#D9770655]', 'text-[#D97706]'],
    approved: ['bg-[#EAF6ED]', 'border-[#1E7E3455]', 'text-[#1E7E34]'],
    completed: ['bg-[#F3F4F6]', 'border-[#4B556355]', 'text-[#4B5563]'],
    rejected: ['bg-[#FEF2F2]', 'border-[#DC262655]', 'text-[#DC2626]'],
  };
  const c = map[s] || map.pending;
  return `<span class="px-2 py-0.5 text-[11px] font-semibold rounded border uppercase tracking-wide ${c.join(' ')}">${MD.escapeHtml(s)}</span>`;
}

function render(rows, allFdrs) {
  const eligible = allFdrs.filter((f) => f.verification_status !== 'rejected' && f.status !== 'released');
  const trs = rows.map((r) => `
    <tr class="border-b border-[#E2E7ED] hover:bg-[#F8FAFC]">
      <td class="py-3 px-4 text-[13px] font-medium text-[#142D4E] whitespace-nowrap">${MD.escapeHtml(r.request_ref)}</td>
      <td class="py-3 px-4 text-[13px] font-tabular-num">${MD.escapeHtml(r.cert_no)}<div class="text-[11px] text-slate-500">${MD.escapeHtml(r.bank_name)}</div></td>
      <td class="py-3 px-4 text-[13px] font-tabular-num text-right">${MD.fmtMoney(r.principal_amount)}</td>
      <td class="py-3 px-4 text-[12px] text-slate-600 max-w-[280px]"><span class="line-clamp-2">${MD.escapeHtml(r.reason || '')}</span></td>
      <td class="py-3 px-4">${releaseBadge(r.status)}${r.decided_by_name ? `<div class="text-[10px] text-slate-400 mt-0.5">by ${MD.escapeHtml(r.decided_by_name)}</div>` : ''}</td>
      <td class="py-3 px-4 text-[12px] font-tabular-num whitespace-nowrap">${MD.fmtDate(r.requested_at)}</td>
    </tr>`).join('');

  document.getElementById('mdshell-content').insertAdjacentHTML('beforeend', `
    <div class="bg-white rounded-lg border border-[#E2E7ED] shadow-sm p-5">
      <h2 class="font-headline-sm text-[16px] font-semibold text-[#142D4E]">New release request</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-3">
        <label class="flex flex-col gap-1">
          <span class="text-[12px] font-semibold text-slate-600 uppercase tracking-wide">FDR record</span>
          <select id="rel-fdr" class="h-9 px-2 text-[13px] border border-[#E2E7ED] rounded bg-white">
            ${eligible.map((f) => `<option value="${f.id}">${MD.escapeHtml(f.submission_ref)} — ${MD.escapeHtml(f.cert_no)} (${MD.fmtMoney(f.principal_amount)})</option>`).join('')}
          </select>
        </label>
        <label class="flex flex-col gap-1 col-span-1 md:col-span-1">
          <span class="text-[12px] font-semibold text-slate-600 uppercase tracking-wide">Reason (minimum 20 characters — reviewed by an officer)</span>
          <textarea id="rel-reason" rows="3" class="px-3 py-2 text-[13px] border border-[#E2E7ED] rounded focus:outline-none focus:border-[#142D4E]" placeholder="State the settlement purpose: course closure, refund cycle, commission requisition, etc."></textarea>
        </label>
      </div>
      <div class="flex items-center gap-2 mt-4">
        <button class="px-4 py-2 bg-[#142D4E] text-white rounded text-xs font-semibold hover:bg-[#1E416F]" onclick="pageSubmit()">Submit request</button>
        <span id="rel-status" class="text-[12px] text-slate-500"></span>
      </div>
      <p class="text-[11px] text-slate-500 mt-2">Funds are never presumed released — an AICTE officer must approve the request and record explicit completion evidence.</p>
    </div>
    <div class="bg-white rounded-lg border border-[#E2E7ED] shadow-sm overflow-hidden">
      <div class="overflow-x-auto"><table class="w-full">
        <thead><tr class="h-[38px] bg-[#F8FAFC] border-b border-[#E2E7ED] text-[11px] font-semibold uppercase text-slate-500 tracking-wider">
          <th class="py-2 px-4 text-left">Reference</th><th class="py-2 px-4 text-left">FDR</th>
          <th class="py-2 px-4 text-right">Principal</th><th class="py-2 px-4 text-left">Reason</th>
          <th class="py-2 px-4 text-left">Status</th><th class="py-2 px-4 text-left">Requested</th>
        </tr></thead>
        <tbody>${trs || '<tr><td colspan="6" class="py-8 text-center text-[13px] text-slate-500">No release requests yet.</td></tr>'}</tbody></table></div>
    </div>`);
}

async function pageSubmit() {
  const st = document.getElementById('rel-status');
  st.textContent = 'Submitting…';
  try {
    const { data } = await MD.api('POST', '/college/releases', {
      fdrId: Number(document.getElementById('rel-fdr').value),
      reason: document.getElementById('rel-reason').value.trim(),
    });
    MD.toast(data.message || 'Release request submitted.', false);
    boot();
  } catch (e) { MD.toast(e.message, true); st.textContent = ''; }
}
window.pageSubmit = pageSubmit;
boot().catch((e) => MD.toast(e.message, true));
</script>
</body>
</html>
