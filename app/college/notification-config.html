<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Notification Config — MoneyDeck</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:"class",theme:{extend:{fontFamily:{"headline-sm":["Inter"],"label-sm":["Inter"],"body-md":["Inter"],"body-sm":["Inter"],"tabular-num":["Inter"]}}}};</script>
<style>html,body{margin:0;padding:0;}::-webkit-scrollbar{display:none;}</style>
<link rel="stylesheet" href="/app/assets/stitch-harmonization.css"/></head>
<body class="bg-[#F5F7FA] font-body-md text-[#202B38] antialiased">
<script src="/app/assets/app.js"></script>
<script src="/app/assets/shell.js"></script>
<script>
'use strict';

async function boot() {
  await MDShell.init({
    role: 'college', page: 'Notification Config', icon: 'tune',
    heading: 'Maturity & Alert Configuration',
    subheading: 'System-wide alert schedule for pledged FDRs. Individual alerts can be postponed (snoozed) from the Alerts page, but critical items follow AICTE rules and cannot be suppressed.',
  });
  let prefs = null;
  try { prefs = (await MD.api('GET', '/notifications/preferences')).data; } catch { /*.preferences may not exist for college roles */ }
  render(prefs);
}

function render(prefs) {
  const schedule = [
    ['T–30 days', 'upcoming_30', 'Early maturity reminder (in-app + email if configured)'],
    ['T–15 days', 'upcoming_15', 'Second reminder to start the renewal dossier'],
    ['T–7 days', 'upcoming_7', 'Urgent reminder — verification lead time for renewal'],
    ['T–1 day', 'upcoming_1', 'Final reminder before maturity'],
    ['Overdue', 'overdue_daily', 'Critical daily alert. Cannot be snoozed or dismissed until resolved.'],
  ];
  const schedRows = schedule.map(([t, code, desc]) => `
    <tr class="border-b border-slate-100">
      <td class="py-2.5 pr-4 whitespace-nowrap"><span class="text-[13px] font-semibold text-[#142D4E] font-tabular-num">${t}</span></td>
      <td class="py-2.5 pr-4 text-[12px] text-slate-600">${MD.escapeHtml(desc)}</td>
      <td class="py-2.5 text-right">${code === 'overdue_daily'
        ? '<span class="px-2 py-0.5 text-[10px] font-bold rounded bg-[#FEF2F2] text-[#DC2626] border border-[#DC262655] uppercase">Mandatory</span>'
        : '<span class="px-2 py-0.5 text-[10px] font-semibold rounded bg-[#EAF6ED] text-[#1E7E34] border border-[#1E7E3455] uppercase tracking-wide">Active</span>'}</td>
    </tr>`).join('');

  document.getElementById('mdshell-content').insertAdjacentHTML('beforeend', `
    <section id="notifications" class="scroll-mt-28 bg-white rounded-lg border border-[#E2E7ED] shadow-sm p-5">
      <h2 class="font-headline-sm text-[16px] font-semibold text-[#142D4E]">Maturity alert schedule</h2>
      <p class="text-[11px] text-slate-500 mt-1">Alerts are generated once per threshold per FDR (deduplicated by calendar day) and addressed to every verified user of your institution.</p>
      <table class="w-full mt-3">${schedRows}</table>
    </section>
    ${prefs ? `<div class="bg-white rounded-lg border border-[#E2E7ED] shadow-sm p-5">
      <h2 class="font-headline-sm text-[16px] font-semibold text-[#142D4E]">Delivery preferences (account)</h2>
      <pre class="text-[11px] text-slate-600 font-tabular-num mt-2 whitespace-pre-wrap">${MD.escapeHtml(JSON.stringify(prefs, null, 2))}</pre>
    </div>` : ''}
    <div class="bg-[#FEF7EC] border border-[#D9770655] rounded-lg p-5">
      <div class="flex items-start gap-2">
        <span class="material-symbols-outlined text-[18px] text-amber-700">lock</span>
        <div>
          <p class="text-[13px] font-semibold text-amber-800">Suppression rules</p>
          <p class="text-[12px] text-amber-800 mt-1">Regular alerts may be snoozed up to 7 days at a time from the <a class="underline font-semibold" href="/app/college/notices.html">Alerts &amp; Notices</a> page — postponing never deletes them. Critical (overdue) alerts and AICTE decision outcomes are non-suppressible by design so no compliance event can be silently hidden.</p>
        </div>
      </div>
    </div>`);

  if (window.location.hash === '#notifications') {
    document.querySelector(window.location.hash)?.scrollIntoView({ block: 'start' });
  }
}
boot().catch((e) => MD.toast(e.message, true));
</script>
</body>
</html>
