<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Alerts &amp; Notices — MoneyDeck</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:"class",theme:{extend:{fontFamily:{"headline-sm":["Inter"],"label-sm":["Inter"],"body-md":["Inter"],"body-sm":["Inter"],"tabular-num":["Inter"]}}}};</script>
<style>html,body{margin:0;padding:0;}::-webkit-scrollbar{display:none;}</style>
<link rel="stylesheet" href="/app/assets/stitch-harmonization.css"/></head>
<body class="bg-[#F5F7FA] font-body-md text-[#202B38] antialiased">
<script src="/app/assets/app.js"></script>
<script src="/app/assets/shell.js"></script>
<script src="/app/assets/content-language.js"></script>
<script>
'use strict';

const CAT_ICON = {
  renewal: 'event', release: 'outbox', notice: 'campaign',
  verification: 'fact_check', correction: 'edit_note', comment: 'comment',
};

async function boot() {
  await MDShell.init({
    role: 'college', page: 'Alerts & Notices', icon: 'notifications',
    heading: 'Alerts & Official Notices',
    subheading: 'Maturity and compliance alerts plus official AICTE notices. Snoozed alerts are postponed, never deleted, and appear in history when they re-activate.',
  });
  const [{ data: vis }, { data: hist }] = await Promise.all([
    MD.api('GET', '/notifications'),
    MD.api('GET', '/notifications/history'),
  ]);
  render(vis.notifications, hist.notifications);
}

function prioBadge(n) {
  if (n.priority === 'critical') return '<span data-content-translation="alerts" class="px-1.5 py-0.5 text-[10px] font-bold rounded bg-[#FEF2F2] text-[#DC2626] border border-[#DC262655] uppercase tracking-wide">CRITICAL — cannot be snoozed</span>';
  if (n.priority === 'high') return '<span data-content-translation="alerts" class="px-1.5 py-0.5 text-[10px] font-semibold rounded bg-[#FEF7EC] text-[#D97706] border border-[#D9770655] uppercase tracking-wide">High</span>';
  return '<span data-content-translation="alerts" class="px-1.5 py-0.5 text-[10px] font-semibold rounded bg-slate-100 text-slate-500 border border-slate-200 uppercase tracking-wide">Normal</span>';
}

function card(n, snoozeable) {
  return `<div class="p-4 border-b border-[#E2E7ED] flex items-start gap-3 ${n.read_at ? 'opacity-70' : ''}">
    <span class="material-symbols-outlined text-[18px] mt-0.5 ${n.priority === 'critical' ? 'text-[#DC2626]' : 'text-slate-400'}">${CAT_ICON[n.category] || 'notifications'}</span>
    <div class="flex-1 min-w-0">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <p data-content-translation="alerts" class="text-[13px] font-semibold ${n.priority === 'critical' ? 'text-[#DC2626]' : 'text-slate-800'}">${MD.escapeHtml(n.title)}</p>
        <span class="text-[10px] text-slate-400 font-tabular-num whitespace-nowrap">${MD.fmtDate(n.created_at)}</span>
      </div>
      <p data-content-translation="alerts" class="text-[12px] text-slate-600 mt-0.5 whitespace-pre-wrap">${MD.escapeHtml(n.body)}</p>
      <div class="flex items-center gap-2 mt-2 flex-wrap">
        ${prioBadge(n)}
        ${n.snoozed_until ? `<span data-content-translation="alerts" class="text-[10px] text-slate-400">snoozed until ${MD.fmtDate(n.snoozed_until)}</span>` : ''}
        <span class="flex-1"></span>
        ${!n.read_at ? `<button class="text-[11px] text-blue-700 hover:underline" onclick="pageRead(${n.id}, this)">Mark read</button>` : ''}
        ${snoozeable && n.priority !== 'critical' && !n.snoozed_until ? `<button class="text-[11px] text-slate-500 hover:underline" onclick="pageSnooze(${n.id})">Snooze 24h</button>` : ''}
      </div>
    </div>
  </div>`;
}

function render(visible, history) {
  const snoozed = history.filter((n) => n.snoozed_until);
  document.getElementById('mdshell-content').insertAdjacentHTML('beforeend', `
    <div class="flex items-center gap-2 mb-4">
      <label for="contentLangSelect" class="text-xs font-semibold text-slate-500">Language / भाषा / भाषा:</label>
      <select id="contentLangSelect" class="text-xs font-medium bg-white border border-slate-300 text-slate-800 rounded-lg px-2.5 py-1.5 shadow-sm focus:outline-none focus:ring-1 focus:ring-slate-900 cursor-pointer">
        <option value="en">English (Original)</option>
        <option value="hi">हिंदी (Hindi)</option>
        <option value="mr">मराठी (Marathi)</option>
      </select>
    </div>
    <div class="bg-white rounded-lg border border-[#E2E7ED] shadow-sm overflow-hidden">
      <div class="px-4 py-3 border-b border-[#E2E7ED] flex items-center justify-between">
        <h2 data-content-translation="alerts" class="font-headline-sm text-[15px] font-semibold text-[#142D4E]">Active alerts (${visible.length})</h2>
        <button class="text-[11px] text-blue-700 hover:underline" onclick="pageReadAll()">Mark all read</button>
      </div>
      <div>${visible.map((n) => card(n, true)).join('') || '<div data-content-translation="alerts" class="p-6 text-[13px] text-slate-500">No active alerts. Maturity reminders arrive automatically at 30, 15, 7 and 1 day(s) before maturity — and daily when overdue.</div>'}</div>
    </div>
    <div class="bg-white rounded-lg border border-[#E2E7ED] shadow-sm overflow-hidden">
      <div class="px-4 py-3 border-b border-[#E2E7ED]"><h2 data-content-translation="alerts" class="font-headline-sm text-[15px] font-semibold text-[#142D4E]">Snoozed (will re-appear)</h2></div>
      <div>${snoozed.map((n) => card(n, false)).join('') || '<div data-content-translation="alerts" class="p-6 text-[13px] text-slate-500">Nothing snoozed.</div>'}</div>
    </div>
    <div class="bg-white rounded-lg border border-[#E2E7ED] shadow-sm overflow-hidden">
      <div class="px-4 py-3 border-b border-[#E2E7ED]"><h2 data-content-translation="alerts" class="font-headline-sm text-[15px] font-semibold text-[#142D4E]">Full history</h2></div>
      <div class="max-h-[480px] overflow-y-auto">${history.map((n) => card(n, false)).join('') || '<div data-content-translation="alerts" class="p-6 text-[13px] text-slate-500">No history yet.</div>'}</div>
    </div>`);
  MDContentLanguage.bind(document.getElementById('contentLangSelect'), 'alerts');
  MD.notifications.markAllAsRead('alerts');
}

async function pageRead(id, btn) {
  try { await MD.api('POST', `/notifications/${id}/read`, {}); if (btn) btn.textContent = 'read'; boot(); }
  catch (e) { MD.toast(e.message, true); }
}
async function pageSnooze(id) {
  try { await MD.api('POST', `/notifications/${id}/snooze`, { hours: 24 }); MD.toast('Snoozed for 24 hours — it will re-appear automatically.', false); boot(); }
  catch (e) { MD.toast(e.message, true); }
}
async function pageReadAll() {
  try { await MD.api('POST', '/notifications/read-all', {}); MD.toast('All visible alerts marked read.', false); boot(); }
  catch (e) { MD.toast(e.message, true); }
}
window.pageRead = pageRead; window.pageSnooze = pageSnooze; window.pageReadAll = pageReadAll;
boot().catch((e) => MD.toast(e.message, true));
</script>
</body>
</html>
