<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Officer Settings — MoneyDeck</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:"class",theme:{extend:{fontFamily:{"headline-sm":["Inter"],"label-sm":["Inter"],"body-md":["Inter"],"body-sm":["Inter"],"tabular-num":["Inter"]}}}};</script>
<style>html,body{margin:0;padding:0;}::-webkit-scrollbar{display:none;}</style>
<link rel="stylesheet" href="/app/assets/stitch-harmonization.css"/></head>
<body class="bg-[#F5F7FA] font-body-md text-[#202B38] antialiased">
<script src="/app/assets/app.js"></script>
<script src="/app/assets/shell.js"></script>
<script>
'use strict';

async function boot() {
  await MDShell.init({
    role: 'officer', page: 'Settings', icon: 'tune',
    heading: 'Officer Settings',
    subheading: 'Your profile and the exact permission set granted to your role. Permissions are enforced server-side on every endpoint.',
  });
  const { data } = await MD.api('GET', '/officer/settings');
  render(data);
}

function render(d) {
  const p = d.profile || {};
  document.getElementById('mdshell-content').insertAdjacentHTML('beforeend', `
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 items-start">
      <div class="bg-white rounded-lg border border-[#E2E7ED] shadow-sm p-5">
        <h2 class="font-headline-sm text-[16px] font-semibold text-[#142D4E]">Profile</h2>
        <div class="flex items-center gap-3 mt-3">
          <div class="w-12 h-12 rounded-full bg-[#142D4E] text-white flex items-center justify-center text-base font-bold">${MD.escapeHtml((p.display_name || '?').split(' ').map(w => w[0]).join('').slice(0,2))}</div>
          <div>
            <p class="text-[14px] font-semibold text-slate-800">${MD.escapeHtml(p.display_name || '')}</p>
            <p class="text-[12px] text-slate-500 font-tabular-num">${MD.escapeHtml(p.email || '')} • ${MD.escapeHtml(p.role_name || '')}</p>
            <p class="text-[11px] text-slate-400">last sign-in ${MD.fmtDate(p.last_login_at)}</p>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4 mt-4">
          <label class="flex flex-col gap-1"><span class="text-[11px] font-semibold text-slate-500 uppercase tracking-wide">Display name</span>
            <input id="st-name" value="${MD.escapeHtml(p.display_name || '')}" class="h-9 px-3 text-[13px] border border-[#E2E7ED] rounded focus:outline-none focus:border-[#142D4E]" /></label>
          <label class="flex flex-col gap-1"><span class="text-[11px] font-semibold text-slate-500 uppercase tracking-wide">Designation</span>
            <input id="st-desig" value="${MD.escapeHtml(p.designation || '')}" class="h-9 px-3 text-[13px] border border-[#E2E7ED] rounded focus:outline-none focus:border-[#142D4E]" /></label>
        </div>
        <div class="flex items-center gap-2 mt-4">
          <button class="px-4 py-2 bg-[#142D4E] text-white rounded text-xs font-semibold hover:bg-[#1E416F]" onclick="pageSave()">Save profile</button>
          <button class="px-4 py-2 bg-white border border-[#E2E7ED] rounded text-xs font-semibold hover:bg-slate-50" onclick="MD.logout()">Sign out of all pages</button>
        </div>
      </div>
      <div class="bg-white rounded-lg border border-[#E2E7ED] shadow-sm p-5">
        <h2 class="font-headline-sm text-[16px] font-semibold text-[#142D4E]">Granted permissions</h2>
        <p class="text-[11px] text-slate-500 mt-1">These permission codes gate the officer APIs you may call — the server refuses anything not listed below regardless of the UI.</p>
        <div class="flex flex-wrap gap-1.5 mt-3">
          ${(d.permissions || []).map((c) => `<span class="px-2 py-0.5 text-[11px] font-tabular-num font-semibold rounded bg-[#EEF4FF] text-[#142D4E] border border-[#C7DAF5]">${MD.escapeHtml(c)}</span>`).join('')}
        </div>
        <div class="mt-4 p-3 bg-[#EEF4FF] border border-[#C7DAF5] rounded-lg text-[11px] text-slate-600">
          <span class="flex items-center gap-1.5 font-semibold text-[#142D4E]"><span class="material-symbols-outlined text-[15px]">lock</span>Session security</span>
          <p class="mt-1">Your session lives in an HttpOnly cookie with server-side expiry; mutating API calls require a per-session CSRF token. No credentials are ever stored in browser storage.</p>
        </div>
      </div>
    </div>`);
}

async function pageSave() {
  try {
    await MD.api('PUT', '/officer/settings/profile', {
      display_name: document.getElementById('st-name').value.trim(),
      designation: document.getElementById('st-desig').value.trim(),
    });
    MD.toast('Profile saved.', false);
    boot();
  } catch (e) { MD.toast(e.message, true); }
}
window.pageSave = pageSave;
boot().catch((e) => MD.toast(e.message, true));
</script>
</body>
</html>
