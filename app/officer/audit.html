<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Audit Log — MoneyDeck</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:"class",theme:{extend:{fontFamily:{"headline-sm":["Inter"],"label-sm":["Inter"],"body-md":["Inter"],"body-sm":["Inter"],"tabular-num":["Inter"]}}}};</script>
<style>html,body{margin:0;padding:0;}::-webkit-scrollbar{display:none;}</style>
<link rel="stylesheet" href="/app/assets/stitch-harmonization.css"/></head>
<body class="bg-[#F5F7FA] font-body-md text-[#202B38] antialiased">
<script src="/app/assets/app.js"></script>
<script src="/app/assets/shell.js"></script>
<script>
'use strict';
const state = { q: '', page: 1 };

async function boot() {
  await MDShell.init({
    role: 'officer', page: 'Audit Log', icon: 'history',
    heading: 'Immutable Audit Log',
    subheading: 'Append-only record enforced by database triggers — rows cannot be updated or deleted by any application path. Newest 500 entries are shown.',
  });
  await load();
}

async function load() {
  const p = new URLSearchParams();
  if (state.q) p.set('q', state.q);
  p.set('page', state.page); p.set('perPage', 50);
  const { data } = await MD.api('GET', `/officer/audit?${p.toString()}`);
  render(data);
}

function render(d) {
  document.querySelectorAll('#mdshell-content > :not(:first-child)').forEach((el) => el.remove());
  const trs = d.entries.map((a) => `
    <tr class="border-b border-slate-100 hover:bg-slate-50">
      <td class="py-2.5 px-4 text-[12px] font-tabular-num whitespace-nowrap text-slate-500">${MD.fmtDate(a.created_at)}<div class="text-[10px] text-slate-400">${(a.created_at || '').split('T')[1] || ''}</div></td>
      <td class="py-2.5 px-4 text-[12px]"><span class="font-semibold text-[#142D4E]">${MD.escapeHtml(a.actor || 'system')}</span>${a.actor_email ? `<div class="text-[10px] text-slate-400">${MD.escapeHtml(a.actor_email)}</div>` : ''}</td>
      <td class="py-2.5 px-4 text-[12px] font-tabular-num">${MD.escapeHtml(a.action)}</td>
      <td class="py-2.5 px-4 text-[12px]">${MD.escapeHtml(a.entity_type)} #${MD.escapeHtml(String(a.entity_id))}</td>
      <td class="py-2.5 px-4 text-[11px] text-slate-500 max-w-[320px]"><code class="font-tabular-num whitespace-pre-wrap break-anywhere">${a.details ? MD.escapeHtml(JSON.stringify(a.details)) : '—'}</code></td>
    </tr>`).join('');

  document.getElementById('mdshell-content').insertAdjacentHTML('beforeend', `
    <div class="bg-white rounded-lg border border-[#E2E7ED] p-4 shadow-sm flex flex-wrap items-center gap-2">
      <div class="relative flex-1 min-w-[220px]">
        <span class="material-symbols-outlined text-[16px] text-slate-400 absolute left-2.5 top-2.5">search</span>
        <input id="audit-q" value="${MD.escapeHtml(state.q)}" class="w-full h-9 pl-8 pr-3 text-[13px] border border-[#E2E7ED] rounded focus:outline-none focus:border-[#142D4E]" placeholder="Search action, actor, entity… (Enter)" />
      </div>
      <button class="h-9 px-3.5 bg-[#142D4E] text-white rounded text-xs font-semibold hover:bg-[#1E416F]" onclick="pageSearch()">Search</button>
      <span class="text-[11px] font-tabular-num text-slate-500 ml-auto">${d.total} entries • page ${d.page}/${d.totalPages}</span>
    </div>
    <div class="bg-white rounded-lg border border-[#E2E7ED] shadow-sm overflow-hidden">
      <div class="overflow-x-auto"><table class="w-full">
        <thead><tr class="h-[38px] bg-[#F8FAFC] border-b border-[#E2E7ED] text-[11px] font-semibold uppercase text-slate-500 tracking-wider">
          <th class="py-2 px-4 text-left">Time</th><th class="py-2 px-4 text-left">Actor</th>
          <th class="py-2 px-4 text-left">Action</th><th class="py-2 px-4 text-left">Entity</th><th class="py-2 px-4 text-left">Details</th>
        </tr></thead>
        <tbody>${trs}</tbody></table></div>
      <div class="flex items-center justify-between px-4 py-3 border-t border-[#E2E7ED]">
        <button class="px-2.5 py-1.5 bg-white border border-[#E2E7ED] rounded disabled:opacity-40" ${d.page<=1?'disabled':''} onclick="pageGo(${d.page-1})">Prev</button>
        <button class="px-2.5 py-1.5 bg-white border border-[#E2E7ED] rounded disabled:opacity-40" ${d.page>=d.totalPages?'disabled':''} onclick="pageGo(${d.page+1})">Next</button>
      </div>
    </div>`);
}

window.pageSearch = function () { state.q = document.getElementById('audit-q').value.trim(); state.page = 1; load().catch((e) => MD.toast(e.message, true)); };
window.pageGo = function (p) { state.page = Math.max(1, p); load().catch((e) => MD.toast(e.message, true)); };
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && document.activeElement?.id === 'audit-q') window.pageSearch(); });
boot().catch((e) => MD.toast(e.message, true));
</script>
</body>
</html>
