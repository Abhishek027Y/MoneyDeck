<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Renewal Monitoring — MoneyDeck</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:"class",theme:{extend:{fontFamily:{"headline-sm":["Inter"],"label-sm":["Inter"],"body-md":["Inter"],"body-sm":["Inter"],"tabular-num":["Inter"]}}}};</script>
<style>html,body{margin:0;padding:0;}::-webkit-scrollbar{display:none;}</style>
<link rel="stylesheet" href="/app/assets/stitch-harmonization.css"/></head>
<body class="bg-[#F5F7FA] font-body-md text-[#202B38] antialiased">
<script src="/app/assets/app.js"></script>
<script src="/app/assets/shell.js"></script>
<script>
'use strict';

async function boot() {
  await MDShell.init({
    role: 'officer', page: 'Renewal Monitoring', icon: 'event_repeat',
    heading: 'Renewal & Maturity Monitoring',
    subheading: 'Institutions approaching or past maturity with no released status. Submitted renewal chains are tracked end-to-end with their verification state.',
  });
  const { data } = await MD.api('GET', '/officer/renewals');
  render(data);
}

function rows(list, alertCls) {
  return list.map((f) => `
    <tr class="border-b border-slate-100 hover:bg-slate-50">
      <td class="py-2.5 px-4 text-[12px]">${MD.escapeHtml(f.institution_name)}</td>
      <td class="py-2.5 px-4 text-[12px] font-tabular-num whitespace-nowrap">${MD.escapeHtml(f.submission_ref)}</td>
      <td class="py-2.5 px-4 text-[12px] font-tabular-num whitespace-nowrap">${MD.escapeHtml(f.cert_no)}</td>
      <td class="py-2.5 px-4 text-[12px] font-tabular-num text-right">${MD.fmtMoney(f.principal_amount)}</td>
      <td class="py-2.5 px-4 text-[12px] font-tabular-num whitespace-nowrap">${MD.fmtDate(f.maturity_date)}</td>
      <td class="py-2.5 px-4"><span class="px-1.5 py-0.5 text-[10px] font-semibold rounded border uppercase tracking-wide ${alertCls}">${MD.escapeHtml(f.verification_status.replace(/_/g, ' '))}</span></td>
      <td class="py-2.5 px-4 text-right"><a class="text-[11px] text-blue-700 hover:underline" href="/aicte_officer_fdr_verification_workspace_ai_engine/code.html?open=${f.id}">Open</a></td>
    </tr>`).join('');
}

function render(d) {
  document.getElementById('mdshell-content').insertAdjacentHTML('beforeend', `
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 items-start">
      <div class="bg-white rounded-lg border border-[#E2E7ED] shadow-sm overflow-hidden">
        <div class="px-4 py-3 border-b border-[#E2E7ED] flex items-center justify-between">
          <h2 class="text-[15px] font-semibold text-[#142D4E]">Maturing within 30 days (${d.upcoming.length})</h2>
          <span class="text-[10px] text-slate-400">alerts sent at 30 / 15 / 7 / 1 day(s)</span>
        </div>
        <div class="overflow-x-auto"><table class="w-full">
          <thead><tr class="h-[34px] bg-[#F8FAFC] border-b border-[#E2E7ED] text-[10px] font-semibold uppercase text-slate-500 tracking-wider">
            <th class="py-2 px-4 text-left">Institution</th><th class="py-2 px-4 text-left">Reference</th><th class="py-2 px-4 text-left">Certificate</th>
            <th class="py-2 px-4 text-right">Principal</th><th class="py-2 px-4 text-left">Maturity</th><th class="py-2 px-4 text-left">Status</th><th></th>
          </tr></thead>
          <tbody>${rows(d.upcoming, 'bg-[#FEF7EC] text-[#D97706] border-[#D9770655]') || '<tr><td colspan="7" class="py-6 text-center text-[12px] text-slate-500">Nothing maturing in the next 30 days.</td></tr>'}</tbody></table></div>
      </div>
      <div class="bg-white rounded-lg border border-[#E2E7ED] shadow-sm overflow-hidden">
        <div class="px-4 py-3 border-b border-[#E2E7ED]">
          <h2 class="text-[15px] font-semibold text-[#DC2626]">Overdue — non-compliant (${d.overdue.length})</h2>
          <span class="text-[10px] text-slate-400">critical daily alerts active until renewed or released</span>
        </div>
        <div class="overflow-x-auto"><table class="w-full">
          <tbody>${rows(d.overdue, 'bg-[#FEF2F2] text-[#DC2626] border-[#DC262655]') || '<tr><td colspan="7" class="py-6 text-center text-[12px] text-emerald-700">No overdue FDRs.</td></tr>'}</tbody></table></div>
      </div>
    </div>
    <div class="bg-white rounded-lg border border-[#E2E7ED] shadow-sm overflow-hidden">
      <div class="px-4 py-3 border-b border-[#E2E7ED]"><h2 class="text-[15px] font-semibold text-[#142D4E]">Submitted renewal chains (latest 100)</h2></div>
      <div class="overflow-x-auto"><table class="w-full">
        <thead><tr class="h-[34px] bg-[#F8FAFC] border-b border-[#E2E7ED] text-[10px] font-semibold uppercase text-slate-500 tracking-wider">
          <th class="py-2 px-4 text-left">Institution</th><th class="py-2 px-4 text-left">Previous FDR</th><th class="py-2 px-4 text-left">New FDR</th>
          <th class="py-2 px-4 text-left">New verification</th>
        </tr></thead>
        <tbody>${d.submitted.map((r) => `
          <tr class="border-b border-slate-100">
            <td class="py-2.5 px-4 text-[12px]">${MD.escapeHtml(r.institution_name)}</td>
            <td class="py-2.5 px-4 text-[12px] font-tabular-num">${MD.escapeHtml(r.prev_ref || '')}<div class="text-[10px] text-slate-500">${MD.escapeHtml(r.prev_cert || '')}</div></td>
            <td class="py-2.5 px-4 text-[12px] font-tabular-num">${MD.escapeHtml(r.new_ref || '')}<div class="text-[10px] text-slate-500">${MD.escapeHtml(r.new_cert || '')}</div></td>
            <td class="py-2.5 px-4">${MD.badge(r.new_verification_status)}</td>
          </tr>`).join('') || '<tr><td colspan="4" class="py-6 text-center text-[12px] text-slate-500">No renewal chains submitted yet.</td></tr>'}</tbody></table></div>
    </div>`);
}
boot().catch((e) => MD.toast(e.message, true));
</script>
</body>
</html>
